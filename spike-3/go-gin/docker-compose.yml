services:
  yugabytedb:
    image: yugabytedb/yugabytedb:2.20.0.0-b7
    command: bin/yugabyted start --daemon=false --listen=0.0.0.0 --base_dir=/tmp/yugabyted-data
    ports:
      - "5433:5433"
      - "7000:7000"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
