spring.application.name=spike2-cassandra

# Port comes only from the PORT env var (no default on purpose: the app refuses to start without it).
server.port=${PORT}

# Origins allowed to call the API from a browser (the KMP web client runs on 8081). Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# Cassandra (started with docker-compose.yml)
spring.cassandra.contact-points=${CASSANDRA_HOST:127.0.0.1}:${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=area
# The schema is owned by schema/schema.cql, not by Spring.
spring.cassandra.schema-action=none
